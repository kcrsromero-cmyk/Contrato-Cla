services:
  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contrata360_migrator
    command: sh scripts/migrate.sh
    environment:
      - DATABASE_URL=${DATABASE_URL}
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contrata360_backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SOCRATA_APP_TOKEN=${SOCRATA_APP_TOKEN}
      - LOG_LEVEL=info
      - PORT=4000
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contrata360_worker
    command: node dist/worker.js
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=info
      - SOCRATA_APP_TOKEN=${SOCRATA_APP_TOKEN}
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
    container_name: contrata360_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
