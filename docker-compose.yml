version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: contrata360_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: contrata360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: contrata360_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Backend and Frontend are typically run locally via `npm run dev`
  # or can be containerized here for a full production-like local setup.
  # For now, we provide the infrastructure dependencies.

volumes:
  postgres_data:
  redis_data:
