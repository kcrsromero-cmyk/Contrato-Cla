# Configuración de nginx para servir el build de Vite con cabeceras de seguridad.
# __API_ORIGIN__ se reemplaza en el build de Docker con el origen de VITE_API_URL.

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Nota: nginx descarta los add_header del bloque padre si una location define los suyos,
    # por eso las cabeceras viven en un snippet incluido en cada location.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # El service worker debe revalidarse siempre para que los despliegues se propaguen.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Assets con hash de Vite: caché larga e inmutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
