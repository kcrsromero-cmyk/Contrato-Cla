add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# CSP en modo Report-Only: no bloquea nada, solo reporta en la consola del navegador.
# Revisar la consola en preproducción y, sin violaciones, cambiar a "Content-Security-Policy".
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://upload.wikimedia.org https://es.wikipedia.org; connect-src 'self' __API_ORIGIN__ https://*.supabase.co wss://*.supabase.co https://www.datos.gov.co https://es.wikipedia.org; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
